# Starting point for `fly launch --no-deploy` (docs/DEPLOY.md §2). Fly detects the Dockerfile
# at the repo root automatically; `fly launch` will read this file and ask to confirm/adjust it.
app = "polstv" # rename if taken; `fly apps create <name>` first, or let `fly launch` pick one
primary_region = "mad" # Madrid; "cdg" (Paris) is the alternative — see docs/DEPLOY.md

[http_service]
  internal_port = 4111
  force_https = true
  # Never autostop: an idle-stopped machine kills the Telegram long-polling bot (PLAN.md §3).
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/status"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
